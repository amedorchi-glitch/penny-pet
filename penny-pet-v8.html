<!DOCTYPE html>

<head>
<meta charset="utf-8">

<style>
:root{color-scheme:light;--ink:#14232a;--mut:#6c7b82;--line:#e8eef0;--soft:#f3f7f8;--ac:#0b8f7c;--acd:#08705f;--acs:#e2f4f0;--am:#f5a623;--rd:#ef394e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:130px}
body{margin:0;background:#f6f9fa;color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}

.wrap{max-width:1280px;margin:0 auto;padding:0 18px}
.promo{background:var(--ink);color:#fff;text-align:center;padding:5px 12px;font-size:.84rem}.promo b{background:var(--am);color:#3a2800;border-radius:6px;padding:0 8px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:#fff;box-shadow:0 1px 0 var(--line)}

.sbox{flex:1;max-width:640px;position:relative}.sbox input{width:100%;height:46px;border:2px solid transparent;background:var(--soft);border-radius:14px;padding:0 44px 0 14px;transition:.2s}.sbox input:focus{border-color:var(--ac);background:#fff}.sbox span{position:absolute;inset-inline-start:14px;top:9px;pointer-events:none}
.hb{margin-inline-start:auto;display:flex;gap:8px}

.pill b{background:var(--rd);color:#fff;border-radius:999px;min-width:22px;text-align:center;font-size:.8rem;padding:0 6px}
.bump{animation:bump .4s}@keyframes bump{40%{transform:scale(1.35)}}

.sl{position:absolute;inset:0;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;padding:0 52px;opacity:0;transition:opacity .6s;pointer-events:none}.sl.on{opacity:1;pointer-events:auto}
.sl h1{font-size:clamp(1.5rem,3.5vw,2.6rem);font-weight:900;margin:0 0 8px;line-height:1.4}.sl p{color:#46585f;margin:0 0 18px}.sl .big{font-size:9rem;text-align:center;animation:fl 4s ease-in-out infinite}

.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}.rail .card{flex:0 0 200px;scroll-snap-align:start;color:var(--ink)}

.dis{position:absolute;top:8px;inset-inline-start:8px;background:var(--rd);color:#fff;border-radius:999px;padding:0 9px;font-size:.78rem;font-weight:700}
.fav{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;border:0;background:#fffc;display:grid;place-items:center}
.bn{font-weight:700;font-size:.78rem}.card h3{margin:0;font-size:.9rem;font-weight:500;line-height:1.8;min-height:3.6em}
.row{margin-top:auto;padding-top:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.price b{font-size:1.02rem;font-weight:900}.price i{font-style:normal;color:var(--mut);font-size:.75rem;margin-inline-start:3px}.price s{display:block;color:var(--mut);font-size:.78rem}
.add{width:36px;height:36px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-size:1.3rem;line-height:1;transition:.15s}.add:hover{background:var(--acd);transform:rotate(90deg)}

.flt button{display:block;width:100%;text-align:start;border:0;background:none;padding:5px 10px;border-radius:10px}.flt button:hover{background:var(--soft)}.flt button.on{background:var(--acs);color:var(--acd);font-weight:700}
.flt input[type=range]{width:100%;accent-color:var(--ac)}.flt label{display:flex;gap:8px;align-items:center;margin-top:10px}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}.chips span{color:var(--mut)}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 16px}.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--mut)}
.pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 320px;gap:24px;background:#fff;border-radius:24px;padding:22px;margin-top:14px}
.gal{border-radius:22px;display:grid;place-items:center;min-height:340px;position:relative}.gal svg{width:72%;animation:fl 4s ease-in-out infinite}
.pg h1{font-size:1.4rem;line-height:1.7;margin:0 0 6px}.br{display:inline-block;font-weight:700;font-size:.8rem;border-radius:999px;padding:0 12px;color:#fff}
.pg ul{padding-inline-start:20px;color:var(--mut)}
.buy{border:1px solid var(--line);border-radius:20px;padding:16px;align-self:start;position:sticky;top:130px;background:#fff;display:grid;gap:10px}
.buy .pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.buy .pr b{font-size:1.6rem;font-weight:900}.buy .pr s{color:var(--mut)}.buy small{color:var(--mut);display:block}
.qty{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 4px;width:max-content}.qty button{border:0;background:none;color:var(--ac);font-size:1.2rem;width:30px}
.btn{border:0;border-radius:14px;padding:11px 22px;background:var(--ac);color:#fff;font-weight:700;transition:.15s}.btn:hover{background:var(--acd);transform:translateY(-2px)}.btn.o{background:#fff;color:var(--ac);border:1px solid var(--ac)}.btn.r{background:var(--rd)}.btn:disabled{background:var(--line);color:var(--mut);cursor:not-allowed;transform:none}
.sp{width:100%;border-collapse:collapse;font-size:.9rem}.sp td{padding:8px 0;border-bottom:1px solid var(--line)}.sp td:first-child{color:var(--mut);width:34%}
.tip{background:var(--acs);border-radius:14px;padding:10px 14px;color:var(--acd);margin:12px 0}
.tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}.tr div{background:#fff;border-radius:20px;padding:14px 18px}.tr b{display:block}.tr span{color:var(--mut);font-size:.88rem}
footer{background:var(--ink);color:#b9c7cc;margin-top:34px;padding:30px 0}footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr;gap:20px}footer b{color:#fff;display:block;margin-bottom:6px}footer button{display:block;border:0;background:none;color:#b9c7cc;padding:2px 0}footer button:hover{color:#fff}
.scrim,.ov{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}.scrim.on,.ov.on{opacity:1;pointer-events:auto}
.ov{z-index:10;display:grid;place-items:center;padding:14px}
.md{position:relative;background:#fff;border-radius:26px;width:min(640px,100%);max-height:calc(100dvh - 28px);overflow:auto;padding:24px;transform:scale(.94) translateY(14px);transition:transform .25s}.ov.on .md{transform:none}
.mx{position:absolute;top:12px;inset-inline-end:14px;border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:1.3rem;line-height:1}
.md h2{margin:0 0 14px;font-size:1.3rem}
.osum{background:var(--soft);border-radius:16px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}.osum div{display:flex;gap:8px;padding:3px 0}.osum div b{margin-inline-start:auto;white-space:nowrap}.osum .tt{font-size:1.05rem;border-top:1px dashed #0002;margin-top:4px;padding-top:6px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:block;font-weight:500;font-size:.88rem}.f .w{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:#fff;width:100%}.f input:focus,.f textarea:focus{border-color:var(--ac)}
.f small{color:var(--rd);display:block;min-height:1.2em}.f .bad{border-color:var(--rd)}
.tabs2{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;padding-inline-end:44px}.tabs2 button{border:0;background:var(--soft);border-radius:999px;padding:3px 16px;font-weight:700;color:var(--mut)}.tabs2 button[aria-pressed=true]{background:var(--ac);color:#fff}
.ord{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.ord .t{display:flex;justify-content:space-between;font-weight:700}.ord .st{background:var(--acs);color:var(--acd);border-radius:999px;padding:0 12px;font-size:.82rem}.ord p{margin:6px 0 0;color:var(--mut);font-size:.88rem}
.steps{display:flex;gap:4px;margin-top:10px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.d{background:var(--ac)}
.ok{text-align:center}.ok svg{width:84px;height:84px}.ok circle{fill:none;stroke:var(--ac);stroke-width:4;stroke-dasharray:252;stroke-dashoffset:252;animation:dr .6s forwards}.ok path{fill:none;stroke:var(--ac);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .4s .5s forwards}@keyframes dr{to{stroke-dashoffset:0}}
#cart{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(400px,100%);background:#fff;z-index:9;transform:translateX(102%);visibility:hidden;transition:transform .3s,visibility .3s;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px))}#cart.on{transform:none;visibility:visible}
.ah{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.ah h2{margin:0;font-size:1.1rem}.x{border:0;background:none;font-size:1.7rem;color:var(--mut)}
#items{flex:1;overflow:auto}.it{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.it .e{font-size:1.8rem;width:52px;height:52px;border-radius:12px;background:var(--soft);display:grid;place-items:center}.it .i{flex:1;font-weight:500;font-size:.9rem}.it small{color:var(--mut)}
#fs{font-size:.85rem;color:var(--acd);font-weight:700;margin-top:10px}.bar2{height:7px;border-radius:4px;background:var(--line);margin:6px 0;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--am),var(--ac));transition:width .4s}
.total{display:flex;justify-content:space-between;font-weight:900;margin:12px 0 10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;padding:9px 20px;border-radius:999px;opacity:0;transform:translateY(14px);transition:.25s;z-index:12;pointer-events:none}.toast.on{opacity:1;transform:none}
@media(max-width:1000px){.pg{grid-template-columns:1fr}.buy{position:static}.gal{min-height:260px}}
@media(max-width:800px){.lay{grid-template-columns:1fr}.flt{position:static}.nav{overflow-x:auto}.dd{display:none!important}.hero{height:230px;border-radius:22px}.sl{grid-template-columns:1fr;padding:0 22px}.sl .big{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.f{grid-template-columns:1fr}.pill span{display:none}.sbox{max-width:none}footer .wrap{grid-template-columns:1fr 1fr}.top{gap:8px}.logo span.t{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
.topbn{max-width:1100px;margin:0 auto;padding:12px 18px 0}
.bn-stage{position:relative;overflow:hidden;border-radius:22px;aspect-ratio:2048/768;background:#fdf1d8;cursor:pointer;isolation:isolate;container-type:inline-size;box-shadow:0 18px 40px -20px #b9741a77;animation:bnin 1.1s cubic-bezier(.2,.8,.2,1) backwards;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@keyframes bnin{from{clip-path:inset(0 0 0 100%);opacity:0}to{clip-path:inset(0);opacity:1}}
.bn-par{position:absolute;inset:0;transform:translate3d(calc(var(--mx,0)*-.9%),calc(var(--my,0)*-1.4%),0);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.bn-kb{position:absolute;inset:0;transform-origin:62% 48%;transform:scale(1.02);animation:bnkb 16s ease-in-out infinite alternate;will-change:transform}
@keyframes bnkb{to{transform:scale(1.07)}}
.bn-kb img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.bn-shine{position:absolute;left:42%;top:4%;width:41%;height:70%;overflow:hidden;pointer-events:none}
.bn-shine::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8) 50%,transparent);transform:translateX(380%) skewX(-18deg);animation:bnshine 5.5s ease-in-out 1.3s infinite}
@keyframes bnshine{0%{transform:translateX(380%) skewX(-18deg)}24%,100%{transform:translateX(-140%) skewX(-18deg)}}
.bn-pill{position:absolute;top:79%;height:15.4%;border-radius:999px;border:2px solid #f5a623;border-width:max(1.5px,.27cqw);box-shadow:0 0 0 3px #fff8,0 0 22px 4px #f5a623aa;opacity:0;pointer-events:none;animation:bnpill 6s ease-in-out infinite}
@keyframes bnpill{0%{opacity:0;transform:scale(.97)}8%{opacity:1;transform:scale(1.02)}26%{opacity:0;transform:scale(1.05)}100%{opacity:0}}
.bn-spark{position:absolute;width:2.4%;aspect-ratio:1;background:radial-gradient(#fff,#ffd36e 65%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;pointer-events:none;animation:bntw 3.2s ease-in-out infinite}
@keyframes bntw{0%,100%{opacity:0;transform:scale(0) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:0;transform:scale(.3) rotate(90deg)}}
.bn-parts{position:absolute;inset:0;pointer-events:none;transform:translate3d(calc(var(--mx,0)*1.2%),calc(var(--my,0)*1.8%),0);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.bn-p{position:absolute;bottom:0;left:var(--x);width:var(--s);aspect-ratio:1;color:var(--c);opacity:0;animation:bnrise var(--t) linear var(--d) infinite}
.bn-p svg,.bn-b svg{display:block;width:100%;height:100%;fill:currentColor}
.bn-p svg{animation:bnsway var(--w) ease-in-out infinite alternate}
@keyframes bnrise{0%{transform:translateY(0) scale(.5);opacity:0}12%{opacity:.8}80%{opacity:.7}100%{transform:translateY(var(--up));opacity:0}}
@keyframes bnsway{from{transform:translateX(-60%) rotate(-18deg)}to{transform:translateX(60%) rotate(18deg)}}
.bn-b{position:absolute;pointer-events:none;z-index:3}
@media(max-width:800px){.topbn{padding:8px 10px 0}.bn-stage{border-radius:14px}}
</style>

function profH(){const u=user||{};return `<form class="f" id="pf" novalidate><div><label>نام و نام‌خانوادگی<input name="name" value="${esc(u.name||'')}"><small></small></label></div><div><label>شماره موبایل<input name="phone" inputmode="numeric" value="${esc(u.phone||'')}"><small></small></label></div><div><label>استان<input name="prov" value="${esc(u.prov||'')}"></label></div><div><label>شهر<input name="city" value="${esc(u.city||'')}"></label></div><div class="w"><label>آدرس<textarea name="addr" rows="2">${esc(u.addr||'')}</textarea></label></div><div><label>کد پستی<input name="zip" inputmode="numeric" maxlength="10" value="${esc(u.zip||'')}"></label></div><div class="w" style="display:flex;gap:8px"><button class="btn" type="submit">${user?'ذخیره اطلاعات':'ورود / ثبت‌نام'}</button>${user?'<button class="btn o" type="button" data-act="out">خروج</button>':''}</div></form>`}
function vAcc(tab){tab=tab||(user?'o':'p');const t=(k,l)=>`<button data-tab="${k}" aria-pressed="${tab===k}">${l}</button>`;
 M(`<h2>${user?'سلام '+esc(user.name.split(' ')[0])+' 👋':'ورود به پنل کاربری'}</h2><div class="tabs2">${user?t('o','سفارش‌ها')+t('f','علاقه‌مندی‌ها'):''}${t('p',user?'اطلاعات من':'ورود / ثبت‌نام')}</div>${tab==='o'?ordH():tab==='f'?favH():profH()}`)}
function check(f,rules){let ok=true;rules.forEach(([n,fn,msg])=>{const el=f.elements[n],v=en(el.value.trim()),bad=!fn(v);el.classList.toggle('bad',bad);const s=el.closest('label').querySelector('small');if(s)s.textContent=bad?msg:'';if(bad)ok=false});return ok}
const R={name:['name',v=>v.length>=3,'نام خود را کامل وارد کنید'],phone:['phone',v=>/^09\d{9}$/.test(v),'شماره موبایل معتبر نیست'],prov:['prov',v=>v.length>=2,'استان را وارد کنید'],city:['city',v=>v.length>=2,'شهر را وارد کنید'],addr:['addr',v=>v.length>=10,'آدرس را کامل‌تر بنویسید'],zip:['zip',v=>/^\d{10}$/.test(v),'کد پستی باید ۱۰ رقم باشد']};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));d.phone=en(d.phone);d.zip=en(d.zip||'');
 if(f.id==='ck'){if(!check(f,Object.values(R)))return;user={...(user||{}),name:d.name,phone:d.phone,prov:d.prov,city:d.city,addr:d.addr,zip:d.zip};sv('pp_user',user);
  const items=oi.map(([i,k])=>({n:P[i].n,k,p:P[i].p})),sub=items.reduce((s,i)=>s+i.p*i.k,0),o={id:'PP-'+(100000+Math.random()*899999|0),date:new Date().toLocaleDateString('fa-IR'),status:'در حال پردازش',items,total:sub+(sub>=FREE?0:SHIP),city:d.city,pay:d.pay};
  orders.unshift(o);sv('pp_orders',orders);if(ofc)cart={};renderCart();head();vOk(o)}
 if(f.id==='pf'){if(!check(f,[R.name,R.phone]))return;user={...(user||{}),...d};sv('pp_user',user);head();toast('اطلاعات ذخیره شد');vAcc('o')}});
document.addEventListener('click',e=>{const t=e.target,g=s=>t.closest(s);let x;
 if(x=g('[data-fav]')){const i=+x.dataset.fav;fav=fav.includes(i)?fav.filter(v=>v!==i):[...fav,i];sv('pp_fav',fav);x.textContent=fav.includes(i)?'❤️':'🤍';if(g('.md'))vAcc('f')}
 else if(x=g('[data-add]'))addCart(+x.dataset.add);
 else if(x=g('[data-go]')){const [a,c]=x.dataset.go.split('|');goL(a,c)}
 else if(x=g('[data-sort-go]')){goL('','');st.sort='x';st.dis=true;rApp()}
 else if(g('[data-home]'))go('home');
 else if(x=g('[data-p]')){cur=+x.dataset.p;go('prod')}
 else if(x=g('[data-sort]')){st.sort=x.dataset.sort;rApp()}
 else if(x=g('[data-dot]'))slide(+x.dataset.dot);
 else if(x=g('[data-tab]'))vAcc(x.dataset.tab);
 else if(x=g('[data-act]')){const k=x.dataset.act;
  if(k==='close')closeM();if(k==='cc')drawer(false);if(k==='acc'){drawer(false);vAcc()}
  if(k==='ck'){drawer(false);openOrder(Object.keys(cart).map(i=>[+i,cart[i]]),true)}
  if(k==='order1')openOrder([[cur,qty]],false);
  if(k==='qp')$('pq').textContent=nf.format(++qty);if(k==='qm'&&qty>1)$('pq').textContent=nf.format(--qty);
  if(k==='addq')addCart(cur,qty);
  if(k==='adv')toast('مشاوره: ۰۲۱-۱۲۳۴۵۶۷۸');
  if(k==='out'){user=null;sv('pp_user',null);head();vAcc('p');toast('از حساب خارج شدید')}}
 else if(t.id==='ov')closeM();else if(t.id==='scrim')drawer(false);else if(g('#open'))drawer(true);
 const u=g('[data-up]'),d=g('[data-dn]');if(u){cart[u.dataset.up]++;renderCart()}if(d){const i=d.dataset.dn;if(--cart[i]<=0)delete cart[i];renderCart()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){const v=e.target.value;if(v.trim()){st={a:'',c:'',q:v,sort:'',max:0,dis:false};view='list';rApp()}else go('home')}if(e.target.id==='mx')$('mxl').textContent=money(+e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='mx'){st.max=+e.target.value;rApp()}if(e.target.id==='dsc'){st.dis=e.target.checked;rApp()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();drawer(false)}});
setInterval(()=>{if(view==='home'){slide((hs+1)%3);}},5000);setInterval(()=>{const e=$('cd');if(e)e.innerHTML=cdh()},1000);
rNav();rApp();renderCart();head();
</script>
<script>
(function(){
const st=document.getElementById('bnst'),pt=document.getElementById('bnp');if(!st)return;
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const PAW='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="11" r="2.4"/><circle cx="9.5" cy="5.8" r="2.5"/><circle cx="15.5" cy="5.8" r="2.5"/><circle cx="19.5" cy="11" r="2.4"/><path d="M12 11.2c-3.3 0-6.2 3.5-6.2 6.2 0 2.1 1.7 2.9 3.4 2.6 1-.2 1.8-.5 2.8-.5s1.8.3 2.8.5c1.7.3 3.4-.5 3.4-2.6 0-2.7-2.9-6.2-6.2-6.2z"/></svg>';
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.4-9.2C1.1 8.1 3.300 4.500 6.700 4.500c2 0 3.500 1.100 5.300 3.100 1.800-2 3.300-3.100 5.300-3.100 3.400 0 5.600 3.600 4.100 7.300C19.500 16.400 12 21 12 21z"/></svg>';
const AM=['#f5a623','#f2b441','#ee8f2d'],RD=['#e5536a','#f08a97'];
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
if(rm)return;
for(let i=0;i<16;i++){const h=i%3===2,s=R(1.4,2.8),p=document.createElement('i');
 p.className='bn-p';
 p.style.cssText='--x:'+R(2,96).toFixed(1)+'%;--s:'+s.toFixed(2)+'%;--up:'+(-(37.5/s*100*1.25)).toFixed(0)+'%;--t:'+R(7,12).toFixed(1)+'s;--d:'+(-R(0,12)).toFixed(1)+'s;--w:'+R(1.6,3.2).toFixed(1)+'s;--c:'+pick(h?RD:AM);
 p.innerHTML=h?HEART:PAW;pt.appendChild(p)}
let raf=0,tx=0,ty=0;
st.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=st.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2;
 if(!raf)raf=requestAnimationFrame(()=>{raf=0;st.style.setProperty('--mx',tx.toFixed(3));st.style.setProperty('--my',ty.toFixed(3))})});
st.addEventListener('pointerleave',()=>{st.style.setProperty('--mx',0);st.style.setProperty('--my',0)});
st.addEventListener('click',e=>{const r=st.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=r.width;
 for(let i=0;i<14;i++){const h=i%2===1,el=document.createElement('i'),z=w*R(.014,.03),a=R(0,6.283),d=w*R(.05,.14);
  el.className='bn-b';el.style.cssText='left:'+(x-z/2)+'px;top:'+(y-z/2)+'px;width:'+z+'px;height:'+z+'px;color:'+pick(h?RD:AM);
  el.innerHTML=h?HEART:PAW;st.appendChild(el);
  el.animate([{transform:'translate(0,0) scale(.3) rotate(0deg)',opacity:1},
   {transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-w*.04)+'px) scale(1.1) rotate('+R(-60,60)+'deg)',opacity:1,offset:.55},
   {transform:'translate('+Math.cos(a)*d*1.2+'px,'+(Math.sin(a)*d*1.2+w*.06)+'px) scale(.6) rotate('+R(-90,90)+'deg)',opacity:0}],
   {duration:R(700,1100),easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>el.remove()}});
})();
